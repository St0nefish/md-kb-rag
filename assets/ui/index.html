<!--
  Docs-first shell for the knowledge-base web UI.

  Historically this page was a single-view graph browser adapted from
  Google's Open Knowledge Format (OKF) reference viewer
  (reference_agent/bundle/templates/viz.html), Apache License 2.0 — see
  LICENSE-okf.md in this directory. The Cytoscape graph canvas, its
  style handling, and the detail-panel markup (now the doc view inside
  #view-doc) descend from that code. The rest of the shell — the
  sidebar document tree, home/browse views, hash routing, and the
  graph toolbar — is md-kb-rag's own.

  Layout: a persistent header (brand, semantic search with a results
  panel, graph link, New document) and sidebar (document tree built
  from api/graph) around a main area that swaps between four
  hash-routed views:

    #/               -> #view-home   (recent docs + browse-by-domain)
    #/browse/<dir>   -> #view-browse (doc listing under a prefix)
    #/doc/<path>     -> #view-doc    (the primary surface: doc reading)
    #/graph[/<path>] -> #view-graph  (full-KB graph, or the <path>
                                      doc's neighborhood)

  Vendored scripts are loaded from local copies, never a CDN. Load
  order matters: cytoscape first, then layout-base -> cose-base ->
  cytoscape-fcose (each UMD build reads the previous one's global, and
  fcose self-registers against the global cytoscape); marked +
  DOMPurify before viz.js (every marked.parse() output is sanitized —
  see viz.js's renderMarkdown); edit.js last, on top of viz.js's
  window.KBViz surface.

  In-browser editing (assets/edit.js) is unchanged from the graph-era
  UI: it keys off the editor-*/confirm-* overlay ids and the
  new-doc-btn/edit-btn/delete-btn buttons, all preserved here.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Knowledge Base</title>
<link rel="stylesheet" href="assets/viz.css">
</head>
<body>
<header>
  <div class="title">
    <a id="brand" href="#/"><strong>Knowledge Base</strong></a>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search the knowledge base" autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
    <a id="nav-graph" class="btn" href="#/graph">Graph</a>
    <button id="new-doc-btn" class="btn btn-primary">New document</button>
  </div>
</header>

<div id="app">
  <aside id="sidebar">
    <nav id="doc-tree"></nav>
  </aside>

  <main id="content">
    <div id="app-loading">Loading knowledge base…</div>
    <div id="app-error" hidden></div>

    <section id="view-home" class="view" hidden>
      <h1>Knowledge Base</h1>
      <div id="home-stats" class="muted"></div>
      <div class="home-section">
        <h2>Recently modified</h2>
        <div id="home-recent"></div>
      </div>
      <div class="home-section">
        <h2>Browse</h2>
        <div id="home-domains" class="domain-grid"></div>
      </div>
    </section>

    <section id="view-browse" class="view" hidden>
      <h1 id="browse-title"></h1>
      <div id="browse-count" class="muted"></div>
      <div id="browse-list"></div>
    </section>

    <section id="view-doc" class="view" hidden>
      <article id="detail-content">
        <header class="detail-header">
          <div class="detail-actions">
            <button id="local-graph-btn" class="btn">Graph</button>
            <button id="edit-btn" class="btn">Edit</button>
            <button id="delete-btn" class="btn btn-danger">Delete</button>
          </div>
          <span class="type-chip" id="detail-type"></span>
          <h1 id="detail-title"></h1>
          <div class="muted" id="detail-id"></div>
        </header>
        <div class="badges" id="detail-badges"></div>
        <dl class="frontmatter">
          <dt>Description</dt><dd id="detail-description"></dd>
          <dt>Domain</dt><dd id="detail-domain"></dd>
          <dt>Tags</dt><dd id="detail-tags"></dd>
          <dt>Modified</dt><dd id="detail-mtime"></dd>
        </dl>
        <hr>
        <div id="detail-body"></div>
        <section id="detail-backlinks" hidden>
          <h2>Cited by</h2>
          <ul id="backlinks-list"></ul>
        </section>
      </article>
    </section>

    <section id="view-graph" class="view" hidden>
      <div id="graph-toolbar">
        <span id="graph-mode-label" class="muted"></span>
        <span id="graph-local-controls" hidden>
          <label class="toolbar-label" for="graph-depth">hops
            <select id="graph-depth">
              <option value="1" selected>1</option>
              <option value="2">2</option>
            </select>
          </label>
          <a id="graph-full-btn" class="btn" href="#/graph">Full graph</a>
        </span>
        <span class="toolbar-spacer"></span>
        <select id="filter-type">
          <option value="">All types</option>
        </select>
        <select id="layout">
          <option value="fcose" selected>fcose (force)</option>
          <option value="cose">cose (force)</option>
          <option value="concentric">concentric</option>
          <option value="breadthfirst">breadth-first</option>
          <option value="circle">circle</option>
          <option value="grid">grid</option>
        </select>
        <label class="toolbar-label" for="toggle-semantic">
          <input id="toggle-semantic" type="checkbox" checked> semantic edges
        </label>
        <button id="reset" class="btn">Reset view</button>
      </div>
      <div id="graph">
        <div id="graph-error" hidden></div>
      </div>
    </section>
  </main>
</div>

<div id="editor-overlay" hidden>
  <div id="editor-modal">
    <header id="editor-toolbar">
      <div id="editor-path-wrap">
        <label for="editor-path" class="muted">Path</label>
        <input id="editor-path" type="text" placeholder="domain/subdir/file.md" spellcheck="false">
      </div>
      <div class="editor-toolbar-status">
        <span id="editor-mode-badge" class="type-chip"></span>
        <span id="editor-status" class="muted"></span>
      </div>
      <div class="editor-actions">
        <button id="editor-save" class="btn btn-primary">Save</button>
        <button id="editor-move" class="btn" hidden>Move…</button>
        <button id="editor-cancel" class="btn">Cancel</button>
      </div>
    </header>
    <div id="editor-errors" hidden></div>
    <div id="editor-body">
      <aside id="editor-schema">
        <h2>Schema</h2>
        <div id="editor-schema-content" class="muted">Loading…</div>
      </aside>
      <div id="editor-source">
        <textarea id="editor-textarea" spellcheck="false" placeholder="Raw markdown content, including the frontmatter block."></textarea>
      </div>
      <div id="editor-preview"></div>
    </div>
  </div>
</div>

<div id="confirm-overlay" hidden>
  <div id="confirm-modal">
    <p id="confirm-message"></p>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="btn">Cancel</button>
      <button id="confirm-ok" class="btn btn-danger">Delete</button>
    </div>
  </div>
</div>

<script src="assets/cytoscape.min.js"></script>
<script src="assets/layout-base.js"></script>
<script src="assets/cose-base.js"></script>
<script src="assets/cytoscape-fcose.js"></script>
<script src="assets/marked.min.js"></script>
<script src="assets/dompurify.min.js"></script>
<script src="assets/viz.js"></script>
<script src="assets/edit.js"></script>
</body>
</html>
