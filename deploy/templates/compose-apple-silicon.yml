# mcp-md-wiki — Apple Silicon (Metal) deployment
#
# Metal GPU acceleration is NOT available inside Docker (macOS Docker runs a
# Linux VM). Run llama-server natively on the host for Metal performance:
#
#   brew install llama.cpp
#   llama-server \
#     --model /path/to/nomic-embed-text-v2-moe-Q8_0.gguf \
#     --host 0.0.0.0 --port 8080 \
#     --embeddings
#
# This compose file runs only qdrant + mcp-md-wiki. The mcp-md-wiki service connects
# to your native llama-server via host.docker.internal.
#
# Usage: cp compose-apple-silicon.yml docker-compose.yml && docker compose up -d

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # No curl/wget/nc in this image, and /health was dropped upstream in favor of
      # /readyz, /healthz, /livez — moot anyway with nothing on board to reach them
      # with. /dev/tcp is a bash builtin, not a real path, so CMD-SHELL (which shells
      # out via the image's default /bin/sh) won't do: that /bin/sh is dash here, and
      # dash has no /dev/tcp — confirmed empirically, it fails with "cannot create
      # /dev/tcp/...: Directory nonexistent". So this has to be exec-form CMD invoking
      # bash directly. Probes 6334 (gRPC) rather than 6333 (REST) because gRPC is what
      # QDRANT_URL points mcp-md-wiki at — a check that proves REST is up while gRPC isn't
      # would be the same class of bug this replaces.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6334"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-md-wiki:
    image: ghcr.io/st0nefish/mcp-md-wiki:latest
    restart: unless-stopped
    labels:
      # Opt in to Watchtower auto-updates. Required when Watchtower runs with
      # WATCHTOWER_LABEL_ENABLE=true, which only touches labelled containers —
      # without this the update request succeeds but changes nothing.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      # Option A: bind-mount a pre-cloned repo (classic workflow)
      # - ${KB_PATH:-./data/repo}:/data:rw
      # Option B: named volume — auto-cloned on first start when GIT_URL is set
      - kb_data:/data:rw
      # Optional: mount config.yaml for overrides beyond env vars
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:8080/v1}
      - EMBEDDING_MODEL=nomic-embed-text-v2-moe
      - EMBEDDING_VECTOR_SIZE=768
      - QDRANT_URL=http://qdrant:6334
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - GIT_PULL_TOKEN=${GIT_PULL_TOKEN:-}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}
      - HOME=/tmp
      - RUST_LOG=${RUST_LOG:-info}
    ports:
      - "${MCP_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "mcp-md-wiki", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  kb_data:
