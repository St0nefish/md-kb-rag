# Traefik reverse proxy labels for the mcp-md-wiki service.
#
# Merge these labels into your docker-compose.yml mcp-md-wiki service.
# Replace placeholders:
#   {{HOSTNAME}}        — your domain (e.g. mcp-md-wiki.example.com)
#   {{RESOLVER}}        — your ACME resolver name (e.g. letsencrypt)
#   {{TRAEFIK_NETWORK}} — your Traefik Docker network (e.g. traefik)
#
# When using Traefik, remove the `ports:` mapping from the mcp-md-wiki service
# since Traefik routes traffic directly via the Docker network.

# Add to mcp-md-wiki service:
labels:
  - "traefik.enable=true"
  - "traefik.http.routers.mcp-md-wiki.rule=Host(`{{HOSTNAME}}`)"
  - "traefik.http.routers.mcp-md-wiki.entrypoints=websecure"
  - "traefik.http.routers.mcp-md-wiki.tls.certresolver={{RESOLVER}}"
  - "traefik.http.services.mcp-md-wiki.loadbalancer.server.port=8001"

# Add to top-level networks:
networks:
  default:
  traefik:
    external: true
    name: {{TRAEFIK_NETWORK}}

# Add to mcp-md-wiki service:
# networks:
