# ============================================================================
# md-kb-rag — full configuration reference
# ============================================================================
#
# Every field shown below is optional and displays its default value.
# The config file itself is optional — if missing, all defaults apply.
#
# STRICT SCHEMA: Unknown fields cause a startup error. If you copied this
# file previously and the schema has changed, remove any unrecognized keys.
#
# SOURCE OF TRUTH: every setting has exactly ONE legal source — either ENV
# or YAML, never both.
#   - ENV only: secrets, connection wiring (URLs), model identity, and
#     bootstrap bindings that cannot change without a restart. NONE of these
#     appear in this file — setting one here is a schema error, not a no-op,
#     so a leftover key from an old config fails loudly instead of silently
#     doing nothing.
#   - YAML only: runtime and tuning settings — everything below.
# See the "ENV-only settings" section at the bottom of this file for the
# full list of environment variables and what each one controls.
#
# QUICK START (Docker Compose):
#   Only .env is required. Set MCP_BEARER_TOKEN + MODEL_PATH/MODEL_FILE,
#   then `docker compose up -d`. Connection env vars are wired in compose.
#   Mount this file at /app/config.yaml only to override runtime/tuning
#   settings like frontmatter rules, chunking, or extra exclude patterns.
#
# RELOADING AFTER A CHANGE: edit this file, then
#   POST /admin/reload  (bearer auth, same token as /mcp)
# re-reads and re-validates it and swaps it into the running server — no
# restart. Not every setting takes effect immediately: some are baked into
# a value or service built once at startup (rate_limit, embedding batch/
# timeout/concurrency tuning, anything auth-related) and stay restart-only;
# chunking.* needs `md-kb-rag index --full` afterward to be meaningful (a
# new chunk size only applies to documents indexed after the change). The
# reload response reports exactly which category each changed setting fell
# into — see README.md's "Config reload" section for the full contract. A
# malformed or invalid file is rejected and the running config is left
# completely untouched, same as a failed restart would leave it.
#
# ============================================================================


# ----------------------------------------------------------------------------
# source — git token indirection only; git_url/branch/data_path are ENV-only
# ----------------------------------------------------------------------------
source:

  # Name of the env var containing the personal access token for git fetch
  # over HTTPS. Token is injected transiently and never written to disk.
  # Omit or leave the env var unset for public repositories.
  git_token_env: "GIT_PULL_TOKEN"

  # git_url, branch, and data_path used to live here. They are bootstrap
  # bindings — which repo, which branch, which filesystem path — that
  # cannot change without a restart, so they moved to GIT_URL / GIT_BRANCH /
  # DATA_PATH. See "ENV-only settings" below.


# ----------------------------------------------------------------------------
# indexing — which files to include/exclude
# ----------------------------------------------------------------------------
# Glob patterns are matched relative to data_path. Setting any list here
# REPLACES the default (not merges), so include the defaults if you want
# to extend them.
indexing:

  # Glob patterns for files to index.
  include:
    - "**/*.md"

  # Glob patterns for directories/files to skip entirely.
  exclude:
    - ".git/**"
    - ".claude/**"
    - ".tools/**"
    - "node_modules/**"

  # Exact filenames to skip (matched against the filename, not the path).
  exclude_files:
    - "CLAUDE.md"
    - "README.md"

  # How often (seconds) the background reindex worker runs a full reconcile sweep,
  # independent of anything a write/webhook/startup already marked dirty. This is a
  # backstop for LOST events (process died mid-run, a webhook never arrived, Qdrant
  # was down when a write tried to mark its path) — not the indexing interval. Normal
  # writes and webhook pushes are indexed near-instantly regardless of this value; a
  # lost event can go unnoticed for up to this long before the next sweep catches it.
  reconcile_interval_secs: 600


# ----------------------------------------------------------------------------
# frontmatter — YAML frontmatter schema and enforcement
# ----------------------------------------------------------------------------
# By default, no frontmatter rules are enforced. Files without frontmatter
# are indexed normally. Configure this section to require specific fields
# or expose metadata as filterable Qdrant payload fields.
#
# This block is now the IMPLICIT ROOT SCHEMA for the knowledge base. A
# directory can override or extend it by adding a `.kb-schema.yaml` file,
# which governs that directory and everything beneath it (cascading like
# CLAUDE.md) — see the README for syntax, cascade/merge rules, and the
# `get_schema` / `update_schema` MCP tools. With no `.kb-schema.yaml` files
# anywhere, this block alone governs the whole tree, same as before.
frontmatter:

  # Fields that MUST be present in every file's frontmatter. Files missing
  # required fields are skipped during indexing (with a warning).
  # Example: [title, description, type, tags]
  required: []

  # Frontmatter fields to store as Qdrant payload fields, enabling filtered
  # search. These become keyword-indexed payload fields on each point.
  # `domain` is not author-written frontmatter — it's derived automatically
  # from each document's top-level folder — but it's still a normal field
  # here for the purpose of getting a Qdrant payload index.
  # Example: [type, domain, tags, status]
  indexed_fields: []

  # Default values applied to frontmatter before validation. If a file is
  # missing a key listed here, the default is injected automatically.
  # Example: { status: "active" }
  defaults: {}

  # Closed-set (enum) enforcement. Maps a frontmatter field to its exhaustive
  # list of allowed values. A file whose field value is NOT in the list fails
  # validation. Absent fields are not checked here — use `required` for that.
  # Open-ended fields (e.g. tags) should be omitted from this map. `domain`
  # is never author-set at all (it's derived from the folder), so it never
  # belongs here either.
  allowed:
    type:
      - guide
      - reference
      - research
      - config
      - troubleshooting
      - architecture
      - project
      - decision-record
      - migration
    status:
      - active
      - draft
      - archived


# ----------------------------------------------------------------------------
# chunking — how markdown files are split into vector chunks
# ----------------------------------------------------------------------------
# The chunker is section-aware: it splits at heading boundaries first, then
# combines small consecutive sections up to target_chunk_size. Sections that
# exceed max_chunk_size are split further by a secondary text splitter.
#
# REINDEX REQUIRED (whole section): POST /admin/reload picks these up for
# the NEXT indexing run, but only for documents that run touches — existing
# Qdrant chunks keep the old boundaries. Run `md-kb-rag index --full`
# afterward for a consistent corpus.
chunking:

  # Ideal chunk size in characters. The chunker accumulates sections until
  # adding the next one would exceed this limit, then starts a new chunk.
  target_chunk_size: 1000

  # Hard upper limit. Sections larger than this are force-split by a
  # secondary markdown-aware splitter. Must be >= target_chunk_size.
  max_chunk_size: 1500

  # Prepend the document's `description` frontmatter field (if present) to
  # every chunk from that document. Gives the embedding model more context
  # about what the chunk relates to.
  prepend_description: true


# ----------------------------------------------------------------------------
# embedding — tuning knobs and secret indirection only
# ----------------------------------------------------------------------------
# base_url, model, and vector_size are connection wiring / model identity —
# they cannot change without a restart, so they are ENV-only
# (EMBEDDING_BASE_URL / EMBEDDING_MODEL / EMBEDDING_VECTOR_SIZE). See
# "ENV-only settings" below. Everything in this section is a pure tuning
# knob or a secret name-indirection field, and stays YAML-only.
embedding:

  # Name of the env var containing the API key for the embedding provider.
  # Required for OpenAI, hosted Ollama, or any authenticated embedding
  # service. Leave the named env var unset for local/unauthenticated
  # servers (e.g. bundled llama.cpp) — that is not an error, it just means
  # no key is sent. The key VALUE never goes in this file.
  api_key_env: "EMBEDDING_API_KEY"

  # Number of texts to send per API request. Higher values are faster but
  # use more memory on the embedding server. Tune based on your model's
  # context window and available VRAM.
  # RESTART REQUIRED: baked into the embedding client at startup — POST
  # /admin/reload cannot change this on a running server.
  batch_size: 32

  # Wall-clock timeout (seconds) for a single embedding HTTP request. A batch
  # of 32 chunks can legitimately take several seconds on a CPU-only embedding
  # server, so this needs headroom above a typical API timeout — a request
  # that hangs past this becomes a retryable error instead of blocking
  # forever. Tuning knob, not a connection setting — no env var override.
  # RESTART REQUIRED: baked into the embedding client's HTTP timeout at
  # startup — POST /admin/reload cannot change this on a running server.
  request_timeout_secs: 60

  # Max number of embedding batches sent concurrently during indexing. The
  # bundled llama.cpp embedding service runs with `--parallel 2`, so
  # concurrency beyond 2 mostly queues server-side rather than helping today;
  # 4 is a compromise that leaves headroom for a future GPU deployment with
  # more parallel slots. Tuning knob, not a connection setting — no env var
  # override.
  # RESTART REQUIRED: baked into the embedding client at startup — POST
  # /admin/reload cannot change this on a running server.
  batch_concurrency: 4


# ----------------------------------------------------------------------------
# qdrant — moved entirely to ENV (QDRANT_URL, QDRANT_COLLECTION)
# ----------------------------------------------------------------------------
# There is no `qdrant:` section any more — url is connection wiring and
# collection is a bootstrap binding (changing it points the server at a
# different collection, which needs a restart either way). Setting a
# `qdrant:` key here is now a schema error. See "ENV-only settings" below.


# ----------------------------------------------------------------------------
# validation — frontmatter validation behavior during indexing
# ----------------------------------------------------------------------------
validation:

  # Master switch. When false, frontmatter is still parsed and stored
  # (so Qdrant and the list_documents metadata index stay accurate) but
  # required/allowed/lint checks are skipped, and all files are indexed
  # regardless of their frontmatter.
  enabled: true

  # Strict mode. When true, files that fail validation are treated as hard
  # errors (indexing aborts). When false, invalid files are skipped with a
  # warning and indexing continues.
  strict: false

  # External lint command run on each markdown file before indexing. Specified
  # as a list: the first element is the program, the rest are arguments. The
  # file path is always appended as the final argument automatically.
  # Non-zero exit = validation failure.
  # Example: ["markdownlint", "--config", ".markdownlint.json"]
  lint_command: null


# ----------------------------------------------------------------------------
# webhook — push-to-reindex endpoint
# ----------------------------------------------------------------------------
# Listens on POST /hooks/reindex. Verifies request authenticity, then
# triggers an incremental reindex. The endpoint is DISABLED entirely if the
# secret env var is unset or empty — no route is mounted.
webhook:

  # Name of the environment variable containing the HMAC shared secret
  # (or GitLab token). The actual secret value goes in .env, not here.
  # RESTART REQUIRED: the secret is resolved once at startup, and whether
  # /hooks/reindex is even mounted is decided at that same startup lookup —
  # POST /admin/reload cannot add, remove, or re-key the route.
  secret_env: "WEBHOOK_SECRET"

  # Webhook provider determines which header is checked for the signature
  # and how verification works. Live-reloadable: POST /admin/reload changes
  # which header the very next delivery is checked against.
  #   "gitea"  — X-Gitea-Signature header, HMAC-SHA256 hex
  #   "github" — X-Hub-Signature-256 header, HMAC-SHA256 with sha256= prefix
  #   "gitlab" — X-Gitlab-Token header, constant-time string comparison
  provider: "gitea"


# ----------------------------------------------------------------------------
# mcp — Model Context Protocol server (Streamable HTTP)
# ----------------------------------------------------------------------------
# Exposes a `search` tool over MCP at /mcp. Clients authenticate with a
# Bearer token. The search tool accepts: query (required), domain, type,
# tags, and limit (default 10, max 50) parameters.
#
# The listen port used to live here (`port:`). It is a bootstrap binding —
# the process cannot change which port it listens on without a restart —
# so it moved to MCP_PORT. See "ENV-only settings" below.
mcp:

  # Name of the environment variable containing the Bearer token for MCP
  # authentication.
  # RESTART REQUIRED: the token is resolved from the named env var once at
  # startup — POST /admin/reload cannot change which var it reads, or
  # re-check the var's value, on a running server. Security-critical by
  # design: auth must not change underneath an in-flight deployment silently.
  bearer_token_env: "MCP_BEARER_TOKEN"

  # When false (the default), the server refuses to start if the bearer token
  # env var is unset or empty. Set to true only in trusted environments where
  # authentication is handled by an upstream proxy or is genuinely not needed.
  # RESTART REQUIRED — same reasoning as bearer_token_env above.
  allow_unauthenticated: false

  # Hostnames accepted in the inbound Host header. Empty (the default) accepts
  # any Host, which is fine for most deployments: the check guards against DNS
  # rebinding, and a bearer-authenticated server already refuses those requests
  # at auth. Worth setting mainly when allow_unauthenticated is true.
  #
  # Behind a reverse proxy, list the PUBLIC hostname clients connect to — the
  # proxy forwards the original Host header, not the container's address.
  # Include a port only if clients send one.
  #
  # RESTART REQUIRED: baked into the MCP transport when it is built at
  # startup — POST /admin/reload cannot change this on a running server.
  # allowed_hosts:
  #   - "kb.example.com"

  # Custom narrative for MCP server instructions. Tells agents what this
  # knowledge base covers. If omitted, a generic read+write description is used.
  # The server automatically appends discovered filter values (domains, types,
  # tags, etc.) from the indexed data, then a write-authoring section that lists
  # required frontmatter fields and any fixed allowed values from the config.
  # Keep this short — the dynamic sections add the detail.
  # Live-reloadable: picked up by the periodic metadata-refresh timer below,
  # so it takes effect within metadata_refresh_secs of a POST /admin/reload.
  # instructions: "Homelab infrastructure wiki covering networking, Docker, storage, and monitoring. Read with search/get_document; write with create_document, edit_document, delete_document."

  # How often (in seconds) to refresh discovered metadata (filter values)
  # from Qdrant. Appended to the instructions so agents know what filters
  # are available. Default: 300 (5 minutes).
  # Live-reloadable: governs the timer's OWN next sleep, so a reload changes
  # how long until the following refresh, not the one already in progress.
  # metadata_refresh_secs: 300


# ----------------------------------------------------------------------------
# write — behaviour of the create_document / edit_document MCP write tools
# ----------------------------------------------------------------------------
write:

  # When true (the default), creating a new document first embeds its content
  # and searches the collection for near-duplicates. If a document with
  # cosine similarity >= dedup_threshold is found, the write is refused with a
  # structured error naming the duplicate file. The agent can override the
  # check by passing `force_new=true` in the tool call.
  # Set to false to disable the check entirely (e.g. during bulk migrations).
  dedup_enabled: true

  # Cosine similarity score at or above which a candidate is treated as a
  # duplicate and the create is refused. Range: 0.0–1.0 (1.0 = identical).
  # Always a dense cosine score: the dedup search is pinned to dense-only with
  # reranking detached, so this threshold is unaffected by `search.hybrid`
  # (whose RRF scores are ~0.01–0.03) and by `reranking.enabled`.
  # 0.80 works well for most embedding models; lower it to 0.75–0.80 for
  # shorter or more domain-specific documents.
  dedup_threshold: 0.80

  # Git author identity used for commits made by the write tools (create_document,
  # edit_document). Setting these to a bot identity makes tool-authored commits
  # easy to distinguish from your own hand-made commits in `git log`.
  commit_author_name: "md-kb-rag"
  commit_author_email: "md-kb-rag@localhost"


# ----------------------------------------------------------------------------
# rate_limit — per-IP rate limiting for all HTTP endpoints
# ----------------------------------------------------------------------------
# Uses the Governor algorithm (token bucket) with per-IP tracking. Behind a
# reverse proxy, the real client IP is extracted from X-Forwarded-For,
# X-Real-IP, or Forwarded headers (falling back to peer IP).
#
# Responses include standard rate limit headers:
#   x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-after, retry-after
#
# RESTART REQUIRED (whole section): the rate limiter is built once when the
# HTTP router is assembled at startup — POST /admin/reload cannot add,
# remove, or retune it on a running server.
rate_limit:

  # Set to false to disable rate limiting entirely (e.g. in trusted internal deployments).
  enabled: true

  # Token replenishment rate: one token is added every 1/per_second seconds.
  per_second: 20

  # Maximum burst size: how many requests can be made before rate limiting
  # kicks in. After the burst is exhausted, requests are limited to the
  # per_second rate.
  burst_size: 50


# ----------------------------------------------------------------------------
# search — retrieval behaviour
# ----------------------------------------------------------------------------
search:

  # Enable hybrid sparse+dense retrieval with Reciprocal Rank Fusion (RRF).
  # A pure-Rust BM25-style sparse arm (Qdrant applies IDF server-side) is fused
  # with the dense vector arm, which sharply improves recall for exact tokens —
  # hostnames (ares, atlas), error codes, CLI flags, config keys (state.db).
  # Set to false for legacy dense-only search.
  #
  # No reindex is needed to toggle this: both named vectors are always stored.
  # NOTE: upgrading an EXISTING pre-hybrid collection (single unnamed vector)
  # does require a one-time full reindex (`index --full`) to migrate to the
  # named-vector schema.
  hybrid: true

  # Candidates fetched from each arm (dense + sparse) before RRF fusion.
  # Higher values improve recall at the cost of query latency.
  rrf_candidates: 50

  # Per-document result diversity (issue #86): the maximum number of chunks
  # from a single document allowed to occupy the final result set. Without
  # this, one long document with many indexed chunks can occupy several slots
  # of the reranker candidate pool AND several slots of the final results,
  # crowding out every other document — and this gets worse, unevenly, as a
  # document accumulates chunks over time.
  #
  # The cap is applied to the BEST relevance signal available for a given
  # query — the cross-encoder's ranking when reranking is enabled, otherwise
  # the fused (hybrid) or dense-cosine order — immediately before truncating
  # to the requested result count. Capping happens before that truncation, not
  # after, so a lower-ranked chunk from an under-represented document
  # backfills the slot a capped chunk would have taken, rather than the page
  # just shrinking. When reranking is enabled, a second, more generous cap
  # (4x this value) is also applied to the candidate pool BEFORE reranking —
  # not to recover documents Qdrant already dropped (that's a recall problem,
  # tuned via rrf_candidates / reranking.candidate_limit above and below, not
  # something a post-hoc diversity pass can fix), but to stop an implausibly
  # over-represented document from burning the entire reranker call on chunks
  # that could never survive the final cap anyway.
  #
  # 3 is a deliberately conservative default: it stops full monopolization
  # (issue #86's reported symptom) while still preserving legitimate
  # multi-chunk relevance — e.g. three different sections of one guide that
  # all genuinely answer the query — up to that count. Tune against your own
  # corpus; a very long single-document knowledge base may want a higher
  # value, a corpus of many short documents may want a lower one.
  #
  # Set to `null` (or remove the line) to disable diversity entirely and
  # restore pre-#86 behaviour, where a single document may fill every slot.
  diversity_max_per_document: 3


# ----------------------------------------------------------------------------
# reranking — cross-encoder reranking of search results
# ----------------------------------------------------------------------------
# base_url and model are connection wiring / model identity — ENV-only
# (RERANKING_BASE_URL / RERANKING_MODEL), required only when enabled is
# true. See "ENV-only settings" below. `enabled` and `candidate_limit` are
# pure tuning knobs and stay YAML-only — RERANKING_ENABLED and
# RERANKING_CANDIDATE_LIMIT env vars are NOT honored (a deployment that
# still sets one logs a startup warning and the var is otherwise ignored).
reranking:

  # Master switch. When true, RERANKING_BASE_URL and RERANKING_MODEL become
  # required env vars at startup.
  # RESTART REQUIRED: whether the server holds a reranking client at all is
  # decided once at startup — POST /admin/reload cannot flip this on a
  # running server. candidate_limit below IS live-reloadable, but only on a
  # server that already started with reranking enabled.
  enabled: false

  # Name of the env var containing the API key for the reranking provider.
  # Same semantics as embedding.api_key_env.
  api_key_env: "RERANKING_API_KEY"

  # Number of candidates fetched before reranking narrows them down.
  # Higher values improve rerank quality at the cost of latency.
  candidate_limit: 50


# ============================================================================
# ENV-only settings — cannot be set here; setting any of these under the
# matching YAML section above is a schema error (unknown field)
# ============================================================================
#
# Secrets (name-indirection — the *_env fields above name which var to read;
# the secret VALUE only ever comes from the named env var):
#   EMBEDDING_API_KEY   — named by embedding.api_key_env, default name shown
#   RERANKING_API_KEY   — named by reranking.api_key_env, default name shown
#   GIT_PULL_TOKEN      — named by source.git_token_env
#   WEBHOOK_SECRET      — named by webhook.secret_env
#   MCP_BEARER_TOKEN    — named by mcp.bearer_token_env
#
# Connection wiring (required, no default):
#   EMBEDDING_BASE_URL  — base URL of the embedding API
#   QDRANT_URL          — Qdrant gRPC endpoint (port 6334, not REST 6333)
#   RERANKING_BASE_URL  — required only when reranking.enabled: true
#
# Model identity:
#   EMBEDDING_MODEL     — required, no default
#   EMBEDDING_VECTOR_SIZE — optional, default 768. Must match the model's
#                         output dimensionality. Changing it requires a full
#                         reindex (drops + recreates the Qdrant collection).
#   RERANKING_MODEL     — required only when reranking.enabled: true
#
# Bootstrap bindings (optional, sensible defaults — cannot change without a
# restart):
#   GIT_URL             — git remote URL. When set, the server auto-clones
#                         the repo into DATA_PATH on first start and runs a
#                         full initial index. Subsequent updates are pulled
#                         via the webhook endpoint. If unset, the knowledge
#                         base must be provided via a bind-mount at
#                         DATA_PATH. Default: unset.
#   GIT_BRANCH          — branch to track when GIT_URL is set. Default: "master".
#   DATA_PATH           — filesystem path to the knowledge base root. In
#                         Docker, bind-mount your repo to this path. The
#                         SQLite state database is written to
#                         <DATA_PATH>/state.db. Default: "/data".
#   QDRANT_COLLECTION   — collection name. One collection per knowledge
#                         base. Changing this creates a new empty collection
#                         on next startup; the old one is not deleted.
#                         Default: "knowledge-base".
#   MCP_PORT            — port the HTTP server listens on (serves both MCP
#                         and webhook routes). Default: 8001.
#
# ============================================================================
