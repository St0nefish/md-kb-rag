services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"   # REST API (debugging only)
      - "127.0.0.1:6334:6334"   # gRPC (used by kb-rag)
    healthcheck:
      # No curl/wget/nc in this image, and /health was dropped upstream in favor of
      # /readyz, /healthz, /livez — moot anyway with nothing on board to reach them
      # with. /dev/tcp is a bash builtin, not a real path, so CMD-SHELL (which shells
      # out via the image's default /bin/sh) won't do: that /bin/sh is dash here, and
      # dash has no /dev/tcp — confirmed empirically, it fails with "cannot create
      # /dev/tcp/...: Directory nonexistent". So this has to be exec-form CMD invoking
      # bash directly. Probes 6334 (gRPC) rather than 6333 (REST) because gRPC is what
      # QDRANT_URL below actually points kb-rag at — a check that proves REST is up
      # while gRPC isn't would be the same class of bug this replaces.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6334"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  embeddings:
    # CPU image — works everywhere, no GPU drivers needed.
    # Pin to a build tag (e.g. server-b8233) for reproducibility.
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ${MODEL_PATH:-./data/models}:/models:ro
    # nomic-embed-text-v2-moe supports 8192-token context but the GGUF metadata
    # incorrectly reports 512. The --override-kv flag corrects this so the full
    # context window is usable, enabling larger markdown chunks per embedding.
    # The --ctx-size, --batch-size, and --ubatch-size flags are set to match.
    # If you switch to a different model, adjust or remove these overrides.
    command: >
      --model /models/${MODEL_FILE:-model.gguf}
      --host 0.0.0.0 --port 8080
      --embeddings
      --ctx-size 8192
      --batch-size 8192
      --ubatch-size 8192
      --override-kv nomic-bert-moe.context_length=int:8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    # -------------------------------------------------------------------------
    # GPU BACKENDS — uncomment ONE block below to replace the CPU default above.
    # Each block overrides image, command, and adds device access.
    # Pin tags for reproducibility (e.g. server-cuda12-b8233).
    # -------------------------------------------------------------------------

    ## --- NVIDIA CUDA ---
    # image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    # command: >
    #   --model /models/${MODEL_FILE:-model.gguf}
    #   --host 0.0.0.0 --port 8080
