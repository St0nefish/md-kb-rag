name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute sha tag from squash merge
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Squash merge commit message contains "(#123)" — extract PR number
          PR_NUM=$(git log -1 --pretty=%s | grep -oP '\(#\K[0-9]+(?=\))')
          if [ -n "$PR_NUM" ]; then
            HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid')
            TAG="sha-${HEAD_SHA:0:7}"
          else
            # Direct push fallback
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "short_sha=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${TAG}"

          # Also expose a tag keyed to THIS commit on master. The tag above is the
          # PR head SHA, because CI builds the image on the PR branch and this job
          # only retags it — but that SHA does not appear anywhere in master's
          # history, so `git log` gives you no way to find the image for a given
          # master commit. That matters when a deploy needs rolling back: you know
          # the master commit you want to return to, not the PR head it came from.
          echo "merge_sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag as latest
        id: retag
        run: |
          IMAGE="${{ steps.image.outputs.name }}:${{ steps.version.outputs.short_sha }}"
          # CI only builds/pushes the sha image when code changed (see ci.yml path filter).
          # Docs-only merges (e.g. .gitignore) produce no image, so there is nothing to retag.
          if ! docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "No image $IMAGE for this push (docs-only change?) — skipping latest retag."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both tags point at the same manifest — no rebuild, no extra push of
          # layers. The merge-sha tag is what makes a rollback target findable
          # from master's history (see the version step for why the primary tag
          # cannot serve that purpose).
          docker buildx imagetools create \
            --tag ${{ steps.image.outputs.name }}:latest \
            --tag ${{ steps.image.outputs.name }}:${{ steps.version.outputs.merge_sha }} \
            "$IMAGE"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Wait for KB quiet
        if: steps.retag.outputs.skipped != 'true'
        run: |
          URL="${{ vars.KB_STATUS_URL }}"
          TOKEN="${{ secrets.KB_STATUS_TOKEN }}"

          # Both must be configured for the gate to arm. Unset is how you opt out
          # (e.g. a deploy target with no `mcp_last_request_age_secs` support yet, or
          # one nobody has wired the org vars/secrets up for) — a redeploy must never
          # hang because of a gate nobody asked for.
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::KB_STATUS_URL and/or KB_STATUS_TOKEN is not set — quiet-gate skipped, deploying immediately."
            exit 0
          fi

          # Tunable: how long /mcp must have been idle before it's safe to sever
          # whatever session is (or isn't) live. Claude Desktop's own traffic is far
          # more frequent than this during an active session, so a lull this long is
          # a reasonable proxy for "nobody is mid-conversation".
          QUIET_SECS=600
          # Hard cap: a deploy must never stall forever waiting for a lull that never
          # comes — a session that's simply long-running would otherwise block every
          # future release indefinitely.
          MAX_WAIT_SECS=1800
          POLL_INTERVAL_SECS=30
          MAX_CONSECUTIVE_FAILURES=3

          waited=0
          consecutive_failures=0
          while true; do
            if response=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "$URL" 2>&1); then
              consecutive_failures=0
              age=$(printf '%s' "$response" | jq -r '.mcp_last_request_age_secs // "null"')

              if [ "$age" = "null" ]; then
                echo "mcp_last_request_age_secs is null or absent (no MCP traffic yet, or a server predating this field) — proceeding."
                exit 0
              fi

              if [ "$age" -ge "$QUIET_SECS" ] 2>/dev/null; then
                echo "MCP has been quiet for ${age}s (>= ${QUIET_SECS}s) — proceeding with deploy."
                exit 0
              fi

              echo "MCP last request ${age}s ago (< ${QUIET_SECS}s quiet window) — waiting ${POLL_INTERVAL_SECS}s..."
            else
              consecutive_failures=$((consecutive_failures + 1))
              echo "::warning::Quiet-gate poll of ${URL} failed (${consecutive_failures}/${MAX_CONSECUTIVE_FAILURES}): ${response}"
              # Best-effort: the gate must never be the reason a deploy fails, so a
              # flaky/unreachable /status proceeds rather than blocking forever.
              if [ "$consecutive_failures" -ge "$MAX_CONSECUTIVE_FAILURES" ]; then
                echo "::warning::${MAX_CONSECUTIVE_FAILURES} consecutive quiet-gate poll failures — proceeding with deploy anyway."
                exit 0
              fi
            fi

            if [ "$waited" -ge "$MAX_WAIT_SECS" ]; then
              echo "::warning::Waited ${waited}s for a quiet window that never came (cap ${MAX_WAIT_SECS}s) — deploying anyway."
              exit 0
            fi

            sleep "$POLL_INTERVAL_SECS"
            waited=$((waited + POLL_INTERVAL_SECS))
          done

      - name: Trigger Watchtower
        if: steps.retag.outputs.skipped != 'true'
        run: |
          # Pull the retagged image onto the host daemon first so Watchtower's
          # local digest comparison sees the new :latest immediately, rather
          # than racing registry propagation. Mirrors the devbox deploy job.
          docker pull "${{ steps.image.outputs.name }}:latest"
          # Do not swallow transport errors — a failed trigger must fail the job.
          response=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_ATLAS_TOKEN }}" \
            "${{ vars.WATCHTOWER_ATLAS_URL }}?image=${{ steps.image.outputs.name }}:latest")
          echo "${response}"
          updated=$(printf '%s' "${response}" | jq -r '.summary.updated // 0')
          if [ "${updated}" -gt 0 ]; then
            echo "Watchtower updated ${updated} container(s)"
            exit 0
          fi
          # We just retagged :latest to a new digest, so an update is expected.
          # updated=0 means Watchtower saw the request but changed nothing —
          # historically because the container lacked the opt-in label while
          # Watchtower runs with WATCHTOWER_LABEL_ENABLE=true, so the deploy
          # silently no-opped for weeks. Fail loudly instead.
          echo "::error::Watchtower reported updated=0 after retagging :latest."
          echo "Check that the target container carries the opt-in label:"
          echo "  com.centurylinklabs.watchtower.enable=true"
          echo "and that Watchtower can pull ${{ steps.image.outputs.name }}:latest."
          exit 1
