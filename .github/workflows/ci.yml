name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "assets/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile"
              - "docker-compose.yml"
              - "migrations/**"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Rebase onto master
        run: |
          git config user.email "ci@stonefish.tech"
          git config user.name "CI"
          # Persistent self-hosted runner hygiene. Two failure modes to defend against:
          #  1. A prior run whose rebase hit conflicts leaves a stale
          #     .git/rebase-merge, making every later `git rebase` abort with
          #     "already a rebase-merge directory".
          #  2. actions/checkout may land on a stale cached refs/pull/N/merge,
          #     so the workspace HEAD is an old (force-pushed-away) head and the
          #     rebase replays obsolete commits that conflict.
          # Clear any in-progress rebase, then force the workspace to the exact
          # PR head SHA from the event before rebasing onto current master.
          git rebase --abort 2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply
          git fetch --force origin master "refs/pull/${{ github.event.pull_request.number }}/head"
          git checkout --force --detach "${{ github.event.pull_request.head.sha }}"
          git rebase origin/master

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Single source of truth is rust-toolchain.toml's `channel` (#235).
        # dtolnay/rust-toolchain doesn't parse that file itself, so extract
        # it here and feed the same value both to the toolchain action below
        # and to the Docker build arg further down -- that's what keeps this
        # job's own cargo steps and the image `docker buildx build` produces
        # from ever being able to silently diverge again.
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        # --all-targets lints test code too, matching .githooks/pre-commit. Without
        # it, lint failures confined to #[cfg(test)] code sail past both the
        # (opt-in) hook and CI (fix #196).
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Audit dependencies
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-audit --no-confirm
          cargo audit

      - name: Compute version
        id: version
        run: |
          # Use PR branch head SHA so release.yml can find this image via headRefOid
          FULL_SHA="${{ github.event.pull_request.head.sha }}"
          echo "short_sha=sha-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up builder
        run: |
          docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder

      - name: Build and push (sha tag)
        run: |
          # VERSION/REVISION feed the Dockerfile's OCI image labels, which have
          # two real readers: /status's build identity, and arm64-nightly.yml's
          # skip-if-unchanged check, which compares
          # org.opencontainers.image.revision against the commit it would build
          # (#194). Without these args the Dockerfile's `unknown` defaults ship,
          # so that check can never match and the nightly rebuilds every time.
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          docker buildx build \
            --builder ci-builder \
            --push \
            --build-arg RUST_VERSION=${{ steps.rust_version.outputs.version }} \
            --build-arg VERSION="${VERSION}" \
            --build-arg REVISION="${{ github.event.pull_request.head.sha }}" \
            --cache-from type=registry,ref=${{ steps.image.outputs.name }}:buildcache \
            --cache-to type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max \
            --tag ${{ steps.image.outputs.name }}:${{ steps.version.outputs.short_sha }} \
            --file ./Dockerfile \
            .

  # The mocked VectorStore suite proves nothing about real Qdrant wire
  # semantics — filters, phrase matching, RRF, recommend. The seven tests that
  # do exercise a live server (src/qdrant.rs) are #[ignore]d, and plain
  # `cargo test` (above) never passes --ignored, so none of them ran in CI
  # before this job was added (#186, and its narrower instance #133). Bring up
  # the project's own qdrant service and run just those.
  qdrant-integration:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: self-hosted
    # Blocking as of #133. Three separate things had to be true first, and all
    # three now are:
    #  1. Two pre-existing bugs in the tests themselves — an invalid literal
    #     point-ID UUID in phrase_index_enables_exact_phrase_matching's fixture
    #     (fixed by #212) and a genuine assertion mismatch in
    #     recommend_by_point_id_finds_nearest_neighbor (fixed by #231, which
    #     also made the suite safe under cargo's default multi-threaded
    #     harness rather than --test-threads=1). Both closed.
    #  2. The job could never reach qdrant at all: it published ports onto the
    #     host's loopback from a runner that is itself a container. Fixed in
    #     `Start Qdrant` below — see that step's comment.
    #  3. An actual green run. This job had 0 successes in 52 attempts before
    #     that fix; run 33342483836 is the first, with `Run live-Qdrant tests`
    #     reporting "7 passed; 0 failed". It is required from that point on,
    #     not on the strength of local runs.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebase onto master
        run: |
          git config user.email "ci@stonefish.tech"
          git config user.name "CI"
          # Same self-hosted-runner hygiene as the test job above — see its
          # comment for the two failure modes this guards against.
          git rebase --abort 2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply
          git fetch --force origin master "refs/pull/${{ github.event.pull_request.number }}/head"
          git checkout --force --detach "${{ github.event.pull_request.head.sha }}"
          git rebase origin/master

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Same reasoning as the `test` job's identically-named step: derive
        # from rust-toolchain.toml's `channel` rather than resolving
        # `stable`, so this job's `cargo test` can't end up on a different
        # toolchain than the one `test` compiled and linted against (#235).
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Start Qdrant
        run: |
          # The self-hosted runner is itself a container driving the host's
          # Docker daemon through a mounted /var/run/docker.sock, so
          # `docker compose up` creates a SIBLING container on the host and
          # docker-compose.yml's `127.0.0.1:6334:6334` publishes onto the
          # HOST's loopback -- which is not this container's loopback. Every
          # run of this job since it was added failed for that reason, first
          # in the wait step and then in `cargo test` itself, which hardcodes
          # http://localhost:6334 (src/qdrant.rs).
          #
          # Put qdrant in THIS container's network namespace instead: then
          # `localhost:6334` is literally correct, nothing is published on the
          # host (so two PRs' jobs can't collide on 6333/6334), and the tests
          # need no environment plumbing. `hostname` is NOT the container ID
          # on this runner -- derive the real one from /proc/self/mountinfo,
          # which is data-root/storage-driver agnostic because it keys off the
          # second-to-last path component, not a fixed prefix.
          docker rm -f ci-qdrant 2>/dev/null || true
          cid=$(awk '$5=="/etc/hostname"{n=split($4,p,"/"); print p[n-1]}' /proc/self/mountinfo)
          if [[ -z "$cid" ]]; then
            echo "::error::could not determine this runner's own container id"
            exit 1
          fi
          # Image stays single-sourced from docker-compose.yml so the pin
          # can't drift from what the deployment runs.
          image=$(docker compose -f docker-compose.yml config --images qdrant)
          docker run -d --name ci-qdrant --network "container:${cid}" "$image"

      - name: Wait for Qdrant to be ready
        run: |
          # Now genuinely this container's loopback, so a direct probe is
          # correct (poll, not sleep -- see deploy.sh's fix, #198).
          timeout=60
          elapsed=0
          while true; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:6333/readyz || echo "000")
            [[ "$code" == "200" ]] && break
            if (( elapsed >= timeout )); then
              echo "::error::qdrant did not become ready within ${timeout}s (last HTTP status: ${code})"
              docker logs ci-qdrant
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

      - name: Run live-Qdrant tests
        run: cargo test -- --ignored

      - name: Stop Qdrant
        if: always()
        run: docker rm -f ci-qdrant 2>/dev/null || true

  # Gate job for branch protection — set "ci-pass" as the required status check.
  # Passes when both test and qdrant-integration succeed or were skipped
  # (doc-only changes skip both identically, via the same `changes` gate).
  # #133: qdrant-integration used to be deliberately left out of this list —
  # see its own job comment for why that's no longer the case.
  ci-pass:
    if: always()
    needs: [test, qdrant-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          ok=true
          if [[ ! "${{ needs.test.result }}" =~ ^(success|skipped)$ ]]; then
            echo "test: ${{ needs.test.result }}"
            ok=false
          fi
          if [[ ! "${{ needs.qdrant-integration.result }}" =~ ^(success|skipped)$ ]]; then
            echo "qdrant-integration: ${{ needs.qdrant-integration.result }}"
            ok=false
          fi
          if [[ "$ok" == "true" ]]; then
            echo "CI passed (test: ${{ needs.test.result }}, qdrant-integration: ${{ needs.qdrant-integration.result }})"
          else
            echo "CI failed"
            exit 1
          fi
