name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "assets/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile"
              - "docker-compose.yml"
              - "migrations/**"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Rebase onto master
        run: |
          git config user.email "ci@stonefish.tech"
          git config user.name "CI"
          # Persistent self-hosted runner hygiene. Two failure modes to defend against:
          #  1. A prior run whose rebase hit conflicts leaves a stale
          #     .git/rebase-merge, making every later `git rebase` abort with
          #     "already a rebase-merge directory".
          #  2. actions/checkout may land on a stale cached refs/pull/N/merge,
          #     so the workspace HEAD is an old (force-pushed-away) head and the
          #     rebase replays obsolete commits that conflict.
          # Clear any in-progress rebase, then force the workspace to the exact
          # PR head SHA from the event before rebasing onto current master.
          git rebase --abort 2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply
          git fetch --force origin master "refs/pull/${{ github.event.pull_request.number }}/head"
          git checkout --force --detach "${{ github.event.pull_request.head.sha }}"
          git rebase origin/master

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Single source of truth is rust-toolchain.toml's `channel` (#235).
        # dtolnay/rust-toolchain doesn't parse that file itself, so extract
        # it here and feed the same value both to the toolchain action below
        # and to the Docker build arg further down -- that's what keeps this
        # job's own cargo steps and the image `docker buildx build` produces
        # from ever being able to silently diverge again.
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        # --all-targets lints test code too, matching .githooks/pre-commit. Without
        # it, lint failures confined to #[cfg(test)] code sail past both the
        # (opt-in) hook and CI (fix #196).
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Audit dependencies
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-audit --no-confirm
          cargo audit

      - name: Compute version
        id: version
        run: |
          # Use PR branch head SHA so release.yml can find this image via headRefOid
          FULL_SHA="${{ github.event.pull_request.head.sha }}"
          echo "short_sha=sha-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up builder
        run: |
          docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder

      - name: Build and push (sha tag)
        run: |
          docker buildx build \
            --builder ci-builder \
            --push \
            --build-arg RUST_VERSION=${{ steps.rust_version.outputs.version }} \
            --cache-from type=registry,ref=${{ steps.image.outputs.name }}:buildcache \
            --cache-to type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max \
            --tag ${{ steps.image.outputs.name }}:${{ steps.version.outputs.short_sha }} \
            --file ./Dockerfile \
            .

  # The mocked VectorStore suite proves nothing about real Qdrant wire
  # semantics — filters, phrase matching, RRF, recommend. The six tests that
  # do exercise a live server (src/qdrant.rs) are #[ignore]d, and plain
  # `cargo test` (above) never passes --ignored, so none of them have ever
  # run in CI (#186, and its narrower instance #133). Bring up the project's
  # own qdrant service and run just those.
  qdrant-integration:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: self-hosted
    # Deliberately non-blocking for now: running this suite for the first time
    # (while wiring it up) found phrase_index_enables_exact_phrase_matching
    # and recommend_by_point_id_finds_nearest_neighbor FAILING against a real
    # server — an invalid literal point-ID UUID in the phrase test's fixture,
    # and a genuine assertion mismatch in the recommend test. Both are
    # pre-existing bugs in the tests themselves (#133 already tracks the
    # phrase one), not something this CI-wiring change fixes. Making the job
    # required today would immediately red-flag every PR, including the one
    # that adds it, over failures nobody here introduced. continue-on-error
    # keeps the job's own pass/fail visible without letting it block, and it
    # is deliberately left out of ci-pass's `needs` below for the same
    # reason. Flip both once the underlying test bugs are fixed.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebase onto master
        run: |
          git config user.email "ci@stonefish.tech"
          git config user.name "CI"
          # Same self-hosted-runner hygiene as the test job above — see its
          # comment for the two failure modes this guards against.
          git rebase --abort 2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply
          git fetch --force origin master "refs/pull/${{ github.event.pull_request.number }}/head"
          git checkout --force --detach "${{ github.event.pull_request.head.sha }}"
          git rebase origin/master

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Same reasoning as the `test` job's identically-named step: derive
        # from rust-toolchain.toml's `channel` rather than resolving
        # `stable`, so this job's `cargo test` can't end up on a different
        # toolchain than the one `test` compiled and linted against (#235).
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Start Qdrant
        run: |
          # -v first: a persistent self-hosted runner can carry a leftover
          # ./data/qdrant volume from a prior run — start every run clean.
          docker compose -f docker-compose.yml down -v 2>/dev/null || true
          docker compose -f docker-compose.yml up -d qdrant

      - name: Wait for Qdrant to be healthy
        run: |
          # docker-compose.yml already defines qdrant's healthcheck; poll it
          # directly instead of a fixed sleep (see deploy.sh's own fix, #198,
          # for why a flat sleep isn't good enough here either).
          timeout=60
          elapsed=0
          while true; do
            status=$(docker compose -f docker-compose.yml ps --format json qdrant |
              jq -rs 'flatten | .[0].Health // empty')
            [[ "$status" == "healthy" ]] && break
            if [[ "$status" == "unhealthy" ]] || (( elapsed >= timeout )); then
              echo "::error::qdrant did not become healthy within ${timeout}s (status: ${status:-none})"
              docker compose -f docker-compose.yml logs qdrant
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

      - name: Run live-Qdrant tests
        run: cargo test -- --ignored

      - name: Stop Qdrant
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # Gate job for branch protection — set "ci-pass" as the required status check.
  # Passes when test succeeds or was skipped (doc-only changes).
  # qdrant-integration is deliberately NOT in this list — see its own comment.
  ci-pass:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.test.result }}" =~ ^(success|skipped)$ ]]; then
            echo "CI passed (test: ${{ needs.test.result }})"
          else
            echo "CI failed (test: ${{ needs.test.result }})"
            exit 1
          fi
